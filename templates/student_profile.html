<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Profile - MindCare</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-primary: #f8fafc;
        --bg-card: #ffffff;
        --text-primary: #0f172a;
        --text-secondary: #475569;
        --text-muted: #64748b;
        --border-color: #e2e8f0;
        --accent-teal: #0d9488;
        --accent-blue: #2563eb;
        --accent-green: #10b981;
        --accent-amber: #f59e0b;
        --accent-rose: #ef4444;
      }

      * { box-sizing: border-box; }

      body {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url("{{ url_for('static', filename='images/Background.jpg') }}") center/cover no-repeat fixed;
        color: var(--text-primary);
        min-height: 100vh;
        margin: 0;
      }

      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        width: 200px;
        height: 100vh;
        background: var(--bg-card);
        border-right: 1px solid var(--border-color);
        padding: 1.5rem 1rem;
        z-index: 1000;
        overflow-y: auto;
      }

      .sidebar-brand {
        font-weight: 700;
        font-size: 1.1rem;
        color: var(--accent-blue);
        text-decoration: none;
        display: block;
        margin-bottom: 2rem;
        padding-left: 0.5rem;
      }

      .sidebar-nav {
        list-style: none;
        padding: 0;
        margin: 0;
      }

      .sidebar-nav .nav-item {
        margin-bottom: 0.25rem;
      }

      .sidebar-nav .nav-link {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.75rem 1rem;
        color: var(--text-secondary);
        text-decoration: none;
        border-radius: 8px;
        font-weight: 500;
        font-size: 0.9rem;
        transition: all 0.2s ease;
      }

      .sidebar-nav .nav-link:hover {
        background: rgba(37, 99, 235, 0.05);
        color: var(--accent-blue);
      }

      .sidebar-nav .nav-link.active {
        background: rgba(37, 99, 235, 0.1);
        color: var(--accent-blue);
        font-weight: 600;
      }

      .sidebar-nav .nav-icon {
        font-size: 1rem;
        width: 20px;
        text-align: center;
      }

      .main-content {
        margin-left: 200px;
        padding: 1.5rem 0;
      }

      @media (max-width: 991.98px) {
        .sidebar {
          width: 100%;
          height: auto;
          position: relative;
          border-right: none;
          border-bottom: 1px solid var(--border-color);
        }

        .main-content {
          margin-left: 0;
        }
      }

      .page-header {
        padding: 2rem 0 1rem;
      }

      .page-header h1 {
        font-weight: 700;
        font-size: 1.75rem;
        margin-bottom: 0.25rem;
        color: #ffffff;
      }

      .page-header .subtitle {
        color: #ffffff;
        font-size: 0.95rem;
        margin-bottom: 0;
      }

      .glass-card {
        background: rgba(15, 23, 42, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 16px;
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        padding: 1.5rem;
        margin-bottom: 1.5rem;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
        transition: all 0.25s ease;
      }

      .glass-card:hover {
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
        border-color: rgba(255, 255, 255, 0.12);
      }

      .form-label {
        color: #cbd5e1;
        font-weight: 500;
        font-size: 0.85rem;
        margin-bottom: 0.5rem;
      }

      .form-control, .form-select {
        background: rgba(15, 23, 42, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: #f1f5f9;
        border-radius: 10px;
        padding: 0.6rem 0.85rem;
        font-size: 0.85rem;
        transition: all 0.2s ease;
      }

      .form-control::placeholder {
        color: #64748b;
      }

      .form-control:focus, .form-select:focus {
        background: rgba(15, 23, 42, 0.8);
        border-color: var(--accent-blue);
        box-shadow: 0 0 0 0.25rem rgba(37, 99, 235, 0.25);
        color: #f1f5f9;
      }

      .form-control:disabled, .form-select:disabled {
        background: rgba(15, 23, 42, 0.4);
        color: #64748b;
        border-color: rgba(255, 255, 255, 0.06);
      }

      .form-select option {
        background: #1e293b;
        color: #f1f5f9;
      }

      .alert {
        border-radius: 10px;
        border: none;
        font-size: 0.9rem;
      }

      .alert-info {
        background: rgba(37, 99, 235, 0.15);
        color: #93c5fd;
        border: 1px solid rgba(37, 99, 235, 0.3);
      }

      .alert-warning {
        background: rgba(245, 158, 11, 0.15);
        color: #fcd34d;
        border: 1px solid rgba(245, 158, 11, 0.3);
      }

      .alert-success {
        background: rgba(16, 185, 129, 0.15);
        color: #6ee7b7;
        border: 1px solid rgba(16, 185, 129, 0.3);
      }

      .alert-danger {
        background: rgba(239, 68, 68, 0.15);
        color: #fca5a5;
        border: 1px solid rgba(239, 68, 68, 0.3);
      }

      .btn-primary-custom {
        background: var(--accent-blue);
        border: none;
        color: #fff;
        font-weight: 600;
        border-radius: 10px;
        padding: 0.75rem 1.5rem;
        font-size: 0.9rem;
        transition: all 0.2s ease;
      }

      .btn-primary-custom:hover {
        background: #1d4ed8;
        color: #fff;
        transform: translateY(-1px);
        box-shadow: 0 8px 25px rgba(37, 99, 235, 0.35);
      }

      .btn-back {
        background: rgba(37, 99, 235, 0.15);
        color: #60a5fa;
        border: 1px solid rgba(37, 99, 235, 0.25);
        border-radius: 8px;
        padding: 0.5rem 1rem;
        font-size: 0.85rem;
        font-weight: 500;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        transition: all 0.2s ease;
      }

      .btn-back:hover {
        background: rgba(37, 99, 235, 0.25);
        color: #93c5fd;
        transform: translateY(-1px);
      }

      .btn-cancel {
        background: rgba(100, 116, 139, 0.15);
        color: #cbd5e1;
        border: 1px solid rgba(100, 116, 139, 0.25);
        border-radius: 10px;
        padding: 0.75rem 1.5rem;
        font-size: 0.9rem;
        font-weight: 500;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        transition: all 0.2s ease;
      }

      .btn-cancel:hover {
        background: rgba(100, 116, 139, 0.25);
        color: #f1f5f9;
        transform: translateY(-1px);
      }

      .sidebar-logo { height: 32px; width: auto; margin-right: 0.5rem; }
    </style>
  </head>
  <body>
        {% include 'sidebar_student.html' %}

    <main class="main-content">
      <div class="container">
        <div class="page-header d-flex justify-content-between align-items-center flex-wrap gap-2">
          <div>
            <h1 class="mb-0">Welcome to MindCare</h1>
            <p class="subtitle mb-0">My Profile</p>
          </div>
          <a href="{{ url_for('student_dashboard') }}" class="btn-back">Back to Dashboard</a>
        </div>

        <div class="glass-card">
          {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
              {% for category, message in messages %}
                <div class="alert alert-{{ category }}" role="alert">{{ message }}</div>
              {% endfor %}
            {% endif %}
          {% endwith %}

          <form method="POST" action="{{ url_for('student_profile') }}">
            <div class="row g-3">
              <div class="col-md-6">
                <label for="name" class="form-label">Full Name <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="name" name="name" required value="{{ student.name }}">
              </div>
              <div class="col-md-6">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" value="{{ student.email }}" disabled>
              </div>
              <div class="col-md-6">
                <label for="student_id_number" class="form-label">Student ID</label>
                <input type="text" class="form-control" id="student_id_number" value="{{ student.student_id_number }}" disabled>
              </div>
              <div class="col-md-6">
                <label for="phone" class="form-label">Phone Number</label>
                <input type="tel" class="form-control" id="phone" name="phone" value="{{ student.phone }}">
              </div>
              <div class="col-md-6">
                <label for="date_of_birth" class="form-label">Date of Birth</label>
                <input type="date" class="form-control" id="date_of_birth" name="date_of_birth" value="{{ student.date_of_birth }}">
              </div>
              <div class="col-md-6">
                <label for="emergency_contact_name" class="form-label">Emergency Contact Name</label>
                <input type="text" class="form-control" id="emergency_contact_name" name="emergency_contact_name" value="{{ student.emergency_contact_name }}">
              </div>
              <div class="col-md-6">
                <label for="emergency_contact_phone" class="form-label">Emergency Contact Phone</label>
                <input type="tel" class="form-control" id="emergency_contact_phone" name="emergency_contact_phone" value="{{ student.emergency_contact_phone }}">
              </div>
            </div>
            <div class="mt-4 d-flex gap-2">
              <button type="submit" class="btn-primary-custom">Save Changes</button>
              <a href="{{ url_for('student_dashboard') }}" class="btn-cancel">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
