<style>
@import url('https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css');

.sidebar {
  position: fixed;
  top: 0;
  left: 0;
  width: 260px;
  height: 100vh;
  background: #0F172A;
  border-right: 1px solid rgba(255, 255, 255, 0.06);
  padding: 0;
  z-index: 1000;
  overflow-y: auto;
  overflow-x: hidden;
  display: flex;
  flex-direction: column;
  box-shadow: 2px 0 12px rgba(0, 0, 0, 0.3);
}
.sidebar::-webkit-scrollbar { width: 4px; }
.sidebar::-webkit-scrollbar-track { background: transparent; }
.sidebar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 4px; }
.sidebar-header {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 1.25rem 1.25rem 1rem;
  border-bottom: 1px solid rgba(255, 255, 255, 0.06);
  flex-shrink: 0;
}
.sidebar-brand-icon {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  background: linear-gradient(135deg, #2563EB, #7C3AED);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #ffffff;
  flex-shrink: 0;
}
.sidebar-brand-icon svg { width: 22px; height: 22px; stroke: #ffffff; }
.sidebar-brand-text { display: flex; flex-direction: column; gap: 0.125rem; }
.sidebar-brand-title {
  font-weight: 700;
  font-size: 0.85rem;
  color: #ffffff;
  letter-spacing: 0.01em;
  line-height: 1.3;
}
.sidebar-brand-subtitle {
  font-size: 0.65rem;
  color: #64748B;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  font-weight: 500;
}
.sidebar-section-label {
  font-size: 0.6rem;
  font-weight: 700;
  color: #475569;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  padding: 1.25rem 1.25rem 0.5rem;
  flex-shrink: 0;
}
.sidebar-nav { list-style: none; padding: 0; margin: 0; flex: 1; }
.sidebar-nav .nav-item { margin-bottom: 0.125rem; padding: 0 0.5rem; }
.sidebar-nav .nav-link {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 0.625rem 0.875rem;
  color: #94A3B8;
  text-decoration: none;
  border-radius: 12px;
  font-weight: 500;
  font-size: 0.825rem;
  transition: all 0.2s ease;
  border-left: 3px solid transparent;
}
.sidebar-nav .nav-link i.bi {
  font-size: 1.05rem;
  width: 20px;
  text-align: center;
  flex-shrink: 0;
  color: #64748B;
  transition: color 0.2s ease;
}
.sidebar-nav .nav-link:hover { background: #1E293B; color: #E2E8F0; }
.sidebar-nav .nav-link:hover i.bi { color: #CBD5E1; }
.sidebar-nav .nav-link.active {
  background: #2563EB;
  color: #FFFFFF;
  font-weight: 600;
  border-left-color: #FFFFFF;
  box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
}
.sidebar-nav .nav-link.active i.bi { color: #FFFFFF; }
.sidebar-footer {
  border-top: 1px solid rgba(255, 255, 255, 0.06);
  padding: 0.75rem 1.25rem;
  margin-top: auto;
  flex-shrink: 0;
}
.sidebar-user {
  display: flex;
  align-items: center;
  gap: 0.625rem;
  padding: 0.375rem 0.25rem 0.625rem;
}
.user-avatar {
  width: 32px;
  height: 32px;
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.08);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #94A3B8;
  font-size: 1.1rem;
  flex-shrink: 0;
}
.user-details { display: flex; flex-direction: column; gap: 0.0625rem; flex: 1; min-width: 0; }
.user-name {
  font-weight: 600;
  font-size: 0.78rem;
  color: #E2E8F0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.user-role {
  font-size: 0.6rem;
  color: #64748B;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  font-weight: 600;
}
.online-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #10B981;
  flex-shrink: 0;
  box-shadow: 0 0 6px rgba(16, 185, 129, 0.5);
}
.logout-link {
  display: flex;
  align-items: center;
  gap: 0.625rem;
  padding: 0.5rem 0.875rem;
  color: #94A3B8;
  text-decoration: none;
  border-radius: 12px;
  font-weight: 500;
  font-size: 0.8rem;
  transition: all 0.2s ease;
  margin-top: 0.25rem;
}
.logout-link i.bi {
  font-size: 0.95rem;
  width: 20px;
  text-align: center;
  flex-shrink: 0;
  color: #64748B;
}
.logout-link:hover { background: rgba(239, 68, 68, 0.1); color: #F87171; }
.logout-link:hover i.bi { color: #F87171; }
</style>

<nav class="sidebar" id="sidebarAdmin">
  <div class="sidebar-header">
    <div class="sidebar-brand-icon">
      <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        <path d="M12 8v4l3 3"/>
      </svg>
    </div>
    <div class="sidebar-brand-text">
      <span class="sidebar-brand-title">Admin Console</span>
      <span class="sidebar-brand-subtitle">University Counseling Portal</span>
    </div>
  </div>

  <div class="sidebar-section-label">MAIN</div>

  <ul class="sidebar-nav">
    <li class="nav-item">
      <a class="nav-link {% if active_page == 'dashboard' %}active{% endif %}" href="{{ url_for('admin_dashboard') }}">
        <i class="bi bi-speedometer2"></i>
        <span>Dashboard</span>
      </a>
    </li>
    <li class="nav-item">
      <a class="nav-link {% if active_page == 'reports' %}active{% endif %}" href="{{ url_for('admin_reports') }}">
        <i class="bi bi-bar-chart"></i>
        <span>Reports</span>
      </a>
    </li>
    <li class="nav-item">
      <a class="nav-link {% if active_page == 'critical' %}active{% endif %}" href="{{ url_for('admin_critical_cases') }}">
        <i class="bi bi-shield-exclamation"></i>
        <span>Critical Cases</span>
      </a>
    </li>
    <li class="nav-item">
      <a class="nav-link {% if active_page == 'counselors' %}active{% endif %}" href="{{ url_for('admin_manage_counselors') }}">
        <i class="bi bi-person-gear"></i>
        <span>Manage Counselors</span>
      </a>
    </li>
    <li class="nav-item">
      <a class="nav-link {% if active_page == 'messages' %}active{% endif %}" href="{{ url_for('admin_anonymous_messages') }}">
        <i class="bi bi-chat-left-dots"></i>
        <span>Anonymous Messages</span>
      </a>
    </li>
    <li class="nav-item">
      <a class="nav-link {% if active_page == 'announcements' %}active{% endif %}" href="#">
        <i class="bi bi-megaphone"></i>
        <span>Announcement Management</span>
      </a>
    </li>
  </ul>

  <div class="sidebar-footer">
    <div class="sidebar-user">
      <div class="user-avatar">
        <i class="bi bi-person-circle"></i>
      </div>
      <div class="user-details">
        <span class="user-name">{{ session.get('user_name', 'Admin') }}</span>
        <span class="user-role">{{ session.get('user_role', 'admin').title() }}</span>
      </div>
      <span class="online-dot" title="Online"></span>
    </div>
    <a class="logout-link" href="{{ url_for('logout') }}">
      <i class="bi bi-box-arrow-right"></i>
      <span>Logout</span>
    </a>
  </div>
</nav>

<script>
document.addEventListener('DOMContentLoaded', function() {
  var path = window.location.pathname;
  document.querySelectorAll('.sidebar-nav .nav-link').forEach(function(link) {
    link.classList.remove('active');
    if (link.getAttribute('href') && path.indexOf(link.getAttribute('href').replace(/\/$/, '')) !== -1) {
      link.classList.add('active');
    }
  });
});
</script>
