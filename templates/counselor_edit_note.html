<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Counseling Note - MindCare</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-primary: #f8fafc;
        --bg-card: #ffffff;
        --text-primary: #0f172a;
        --text-secondary: #475569;
        --text-muted: #64748b;
        --border-color: #e2e8f0;
        --accent-teal: #0d9488;
        --accent-blue: #2563eb;
        --accent-green: #10b981;
        --accent-amber: #f59e0b;
        --accent-rose: #ef4444;
      }

      * { box-sizing: border-box; }

      body {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url("{{ url_for('static', filename='images/Background 14.webp') }}") center/cover no-repeat fixed;
        color: var(--text-primary);
        min-height: 100vh;
        margin: 0;
      }

      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        width: 200px;
        height: 100vh;
        background: var(--bg-card);
        border-right: 1px solid var(--border-color);
        padding: 1.5rem 1rem;
        z-index: 1000;
        overflow-y: auto;
      }

      .sidebar-brand {
        font-weight: 700;
        font-size: 1.1rem;
        color: var(--accent-teal);
        text-decoration: none;
        display: block;
        margin-bottom: 2rem;
        padding-left: 0.5rem;
      }

      .sidebar-logo {
        height: 32px;
        width: auto;
        margin-right: 0.5rem;
      }

      .sidebar-nav {
        list-style: none;
        padding: 0;
        margin: 0;
      }

      .sidebar-nav .nav-item {
        margin-bottom: 0.25rem;
      }

      .sidebar-nav .nav-link {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.75rem 1rem;
        color: var(--text-secondary);
        text-decoration: none;
        border-radius: 8px;
        font-weight: 500;
        font-size: 0.9rem;
        transition: all 0.2s ease;
      }

      .sidebar-nav .nav-link:hover {
        background: rgba(13, 148, 136, 0.05);
        color: var(--accent-teal);
      }

      .sidebar-nav .nav-link.active {
        background: rgba(13, 148, 136, 0.1);
        color: var(--accent-teal);
        font-weight: 600;
      }

      .sidebar-nav .nav-icon {
        font-size: 1rem;
        width: 20px;
        text-align: center;
      }

      .main-content {
        margin-left: 200px;
        padding: 1.5rem 0;
      }

      @media (max-width: 991.98px) {
        .sidebar {
          width: 100%;
          height: auto;
          position: relative;
          border-right: none;
          border-bottom: 1px solid var(--border-color);
        }

        .main-content {
          margin-left: 0;
        }
      }

      .page-header {
        padding: 2rem 0 1rem;
      }

      .page-header h1 {
        font-weight: 700;
        font-size: 1.75rem;
        margin-bottom: 0.25rem;
        color: #ffffff;
      }

      .page-header .subtitle {
        color: #ffffff;
        font-size: 0.95rem;
        margin-bottom: 0;
      }

      .glass-card {
        background: rgba(15, 23, 42, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 16px;
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        padding: 1.5rem;
        margin-bottom: 1.5rem;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
        transition: all 0.25s ease;
      }

      .glass-card:hover {
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
        border-color: rgba(255, 255, 255, 0.12);
      }

      .glass-card .card-header {
        padding: 0 0 1rem 0;
        margin-bottom: 1rem;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .glass-card .card-header h5 {
        font-weight: 600;
        font-size: 1rem;
        margin: 0;
        color: #f8fafc;
      }

      .header-icon {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 0.9rem;
      }

      .header-icon.notes { background: rgba(245, 158, 11, 0.15); color: #fcd34d; }

      .form-control, .form-select, .form-check-input {
        background: rgba(15, 23, 42, 0.6) !important;
        border: 1px solid rgba(255, 255, 255, 0.1) !important;
        color: #f1f5f9 !important;
        border-radius: 10px !important;
        padding: 0.6rem 0.85rem !important;
        font-size: 0.85rem !important;
      }

      .form-control::placeholder {
        color: #64748b !important;
      }

      .form-control:focus, .form-select:focus, .form-check-input:focus {
        background: rgba(15, 23, 42, 0.8) !important;
        border-color: var(--accent-teal) !important;
        box-shadow: 0 0 0 0.25rem rgba(13, 148, 136, 0.25) !important;
        color: #f1f5f9 !important;
      }

      .form-select option {
        background: #1e293b;
        color: #f1f5f9;
      }

      .form-label {
        color: #cbd5e1;
        font-weight: 500;
        font-size: 0.85rem;
        margin-bottom: 0.5rem;
      }

      .btn-back {
        background: rgba(13, 148, 136, 0.15);
        color: #5eead4;
        border: 1px solid rgba(13, 148, 136, 0.3);
        border-radius: 8px;
        padding: 0.5rem 1rem;
        font-size: 0.85rem;
        font-weight: 500;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        transition: all 0.2s ease;
      }

      .btn-back:hover {
        background: rgba(13, 148, 136, 0.3);
        color: #2dd4bf;
        transform: translateY(-1px);
      }

      .btn-submit {
        background: var(--accent-teal);
        border: none;
        color: #fff;
        font-weight: 600;
        border-radius: 10px;
        padding: 0.75rem 1.5rem;
        font-size: 0.9rem;
        transition: all 0.2s ease;
      }

      .btn-submit:hover {
        background: #0f766e;
        color: #fff;
        transform: translateY(-1px);
        box-shadow: 0 8px 25px rgba(13, 148, 136, 0.35);
      }

      .sidebar-logo { height: 32px; width: auto; margin-right: 0.5rem; }
    </style>
  </head>
  <body>
        {% include 'sidebar_counselor.html' %}

    <main class="main-content">
      <div class="container">
        <div class="page-header d-flex justify-content-between align-items-center flex-wrap gap-2">
          <div>
            <h1 class="mb-0">Welcome to MindCare</h1>
            <p class="subtitle mb-0">Edit Counseling Note</p>
          </div>
          <a href="{{ url_for('counselor_student_detail', student_id=data.student_id) }}" class="btn-back">Back to Student</a>
        </div>

        <div class="glass-card">
          <div class="card-header">
            <span class="header-icon notes">&#x1F4AC;</span>
            <h5>Edit Note</h5>
          </div>
          <form action="{{ url_for('counselor_edit_note', note_id=data.note_id) }}" method="POST">
            <div class="row g-3">
              <div class="col-md-6">
                <label for="note_content" class="form-label">Session Notes</label>
                <textarea class="form-control" id="note_content" name="note_content" rows="4" required>{{ data.note_content }}</textarea>
              </div>
              <div class="col-md-6">
                <label for="session_summary" class="form-label">Session Summary</label>
                <textarea class="form-control" id="session_summary" name="session_summary" rows="4">{{ data.session_summary }}</textarea>
              </div>
              <div class="col-md-4">
                <label for="mood_observed" class="form-label">Mood Observed</label>
                <input type="text" class="form-control" id="mood_observed" name="mood_observed" value="{{ data.mood_observed }}">
              </div>
              <div class="col-md-4">
                <label for="mental_status_assessment" class="form-label">Mental Status Assessment</label>
                <textarea class="form-control" id="mental_status_assessment" name="mental_status_assessment" rows="2">{{ data.mental_status_assessment }}</textarea>
              </div>
              <div class="col-md-4">
                <label for="risk_assessment_update" class="form-label">Risk Assessment Update</label>
                <select class="form-select" id="risk_assessment_update" name="risk_assessment_update">
                  <option value="">No Change</option>
                  <option value="Low" {% if data.risk_assessment_update == 'Low' %}selected{% endif %}>Low</option>
                  <option value="Medium" {% if data.risk_assessment_update == 'Medium' %}selected{% endif %}>Medium</option>
                  <option value="High" {% if data.risk_assessment_update == 'High' %}selected{% endif %}>High</option>
                </select>
              </div>
              <div class="col-md-6">
                <label for="follow_up_required" class="form-label d-block mb-2">Follow-up</label>
                <div class="form-check">
                  <input type="checkbox" class="form-check-input" id="follow_up_required" name="follow_up_required" {% if data.follow_up_required %}checked{% endif %}>
                  <label class="form-check-label" for="follow_up_required">Follow-up Required</label>
                </div>
              </div>
              <div class="col-md-6">
                <label for="follow_up_plan" class="form-label">Follow-up Plan</label>
                <textarea class="form-control" id="follow_up_plan" name="follow_up_plan" rows="2">{{ data.follow_up_plan }}</textarea>
              </div>
              <div class="col-md-6">
                <label for="recommended_resources" class="form-label">Recommended Resources</label>
                <textarea class="form-control" id="recommended_resources" name="recommended_resources" rows="2">{{ data.recommended_resources }}</textarea>
              </div>
              <div class="col-md-6">
                <label for="referral_needed" class="form-label d-block mb-2">Referral</label>
                <div class="form-check">
                  <input type="checkbox" class="form-check-input" id="referral_needed" name="referral_needed" {% if data.referral_needed %}checked{% endif %}>
                  <label class="form-check-label" for="referral_needed">Referral Needed</label>
                </div>
              </div>
              <div class="col-md-12">
                <label for="referral_details" class="form-label">Referral Details</label>
                <textarea class="form-control" id="referral_details" name="referral_details" rows="2">{{ data.referral_details }}</textarea>
              </div>
            </div>
            <div class="mt-3">
              <button type="submit" class="btn-submit">Save Changes</button>
            </div>
          </form>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
