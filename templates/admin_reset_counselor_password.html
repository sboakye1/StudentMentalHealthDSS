<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset Counselor Password - MindCare</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-primary: #f8fafc;
        --bg-card: #ffffff;
        --text-primary: #0f172a;
        --text-secondary: #475569;
        --text-muted: #64748b;
        --border-color: #e2e8f0;
        --accent-teal: #0d9488;
        --accent-blue: #2563eb;
        --accent-green: #10b981;
        --accent-amber: #f59e0b;
        --accent-rose: #ef4444;
      }

      * { box-sizing: border-box; }

      body {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url("{{ url_for('static', filename='images/Background 8.jpg') }}") center/cover no-repeat fixed;
        color: var(--text-primary);
        min-height: 100vh;
        margin: 0;
      }

      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        width: 200px;
        height: 100vh;
        background: var(--bg-card);
        border-right: 1px solid var(--border-color);
        padding: 1.5rem 1rem;
        z-index: 1000;
        overflow-y: auto;
      }

      .sidebar-brand {
        font-weight: 700;
        font-size: 1.1rem;
        color: var(--accent-blue);
        text-decoration: none;
        display: block;
        margin-bottom: 2rem;
        padding-left: 0.5rem;
      }

      .sidebar-nav {
        list-style: none;
        padding: 0;
        margin: 0;
      }

      .sidebar-nav .nav-item {
        margin-bottom: 0.25rem;
      }

      .sidebar-nav .nav-link {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.75rem 1rem;
        color: var(--text-secondary);
        text-decoration: none;
        border-radius: 8px;
        font-weight: 500;
        font-size: 0.9rem;
        transition: all 0.2s ease;
      }

      .sidebar-nav .nav-link:hover {
        background: rgba(37, 99, 235, 0.05);
        color: var(--accent-blue);
      }

      .sidebar-nav .nav-link.active {
        background: rgba(37, 99, 235, 0.1);
        color: var(--accent-blue);
        font-weight: 600;
      }

      .sidebar-nav .nav-icon {
        font-size: 1rem;
        width: 20px;
        text-align: center;
      }

      .main-content {
        margin-left: 200px;
        padding: 1.5rem 0;
      }

      @media (max-width: 991.98px) {
        .sidebar {
          width: 100%;
          height: auto;
          position: relative;
          border-right: none;
          border-bottom: 1px solid var(--border-color);
        }

        .main-content {
          margin-left: 0;
        }
      }

      .page-header {
        padding: 2rem 0 1rem;
      }

      .page-header h1 {
        font-weight: 700;
        font-size: 1.75rem;
        margin-bottom: 0.25rem;
        color: #ffffff;
      }

      .page-header .subtitle {
        color: #ffffff;
        font-size: 0.95rem;
        margin-bottom: 0;
      }

      .glass-card {
        background: rgba(15, 23, 42, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 16px;
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        padding: 1.5rem;
        margin-bottom: 1.5rem;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
        transition: all 0.25s ease;
      }

      .glass-card:hover {
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
        border-color: rgba(255, 255, 255, 0.12);
      }

      .form-label {
        color: #e2e8f0;
        font-size: 0.8rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin-bottom: 0.5rem;
      }

      .form-control {
        background: rgba(15, 23, 42, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: #f1f5f9;
        border-radius: 10px;
        padding: 0.7rem 0.9rem;
        font-size: 0.9rem;
        transition: all 0.2s ease;
      }

      .form-control::placeholder {
        color: #64748b;
      }

      .form-control:focus {
        background: rgba(15, 23, 42, 0.8);
        border-color: var(--accent-blue);
        box-shadow: 0 0 0 0.25rem rgba(37, 99, 235, 0.25);
        color: #f1f5f9;
      }

      .btn-primary-custom {
        background: var(--accent-blue);
        border: none;
        color: #fff;
        font-weight: 600;
        border-radius: 10px;
        padding: 0.75rem 1.75rem;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        transition: all 0.2s ease;
        font-size: 0.95rem;
      }

      .btn-primary-custom:hover {
        background: #1d4ed8;
        color: #fff;
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(37, 99, 235, 0.35);
      }

      .btn-back {
        background: rgba(37, 99, 235, 0.15);
        color: #60a5fa;
        border: 1px solid rgba(37, 99, 235, 0.25);
        border-radius: 10px;
        padding: 0.6rem 1.25rem;
        font-size: 0.9rem;
        font-weight: 500;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        transition: all 0.2s ease;
      }

      .btn-back:hover {
        background: rgba(37, 99, 235, 0.25);
        color: #93c5fd;
        transform: translateY(-1px);
      }

      .btn-cancel {
        background: rgba(100, 116, 139, 0.15);
        color: #cbd5e1;
        border: 1px solid rgba(100, 116, 139, 0.25);
        border-radius: 10px;
        padding: 0.75rem 1.75rem;
        font-size: 0.95rem;
        font-weight: 500;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        transition: all 0.2s ease;
      }

      .btn-cancel:hover {
        background: rgba(100, 116, 139, 0.25);
        color: #f1f5f9;
        transform: translateY(-2px);
      }

      .alert {
        border-radius: 10px;
        border: none;
      }

      .alert-danger {
        background: rgba(239, 68, 68, 0.15);
        color: #fca5a5;
        border: 1px solid rgba(239, 68, 68, 0.3);
      }

      .alert-success {
        background: rgba(16, 185, 129, 0.15);
        color: #6ee7b7;
        border: 1px solid rgba(16, 185, 129, 0.3);
      }

      .sidebar-logo { height: 32px; width: auto; margin-right: 0.5rem; }
      .card { background: rgba(255, 255, 255, 0.92); }
    </style>
  </head>
  <body>
        {% include 'sidebar_admin.html' %}

    <main class="main-content">
      <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <div>
            <h1 class="mb-0" style="font-weight: 700; font-size: 1.75rem; color: #ffffff;">Welcome to MindCare</h1>
            <p class="text-secondary mb-0" style="font-size: 0.95rem; color: #ffffff;">Reset Counselor Password</p>
          </div>
          <a href="{{ url_for('admin_manage_counselors') }}" class="btn btn-back">&#x2190; Manage Counselors</a>
        </div>

        <div class="glass-card">
          {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
              {% for category, message in messages %}
                <div class="alert alert-{{ category }}" role="alert">{{ message }}</div>
              {% endfor %}
            {% endif %}
          {% endwith %}

          <form method="POST" action="{{ url_for('admin_reset_counselor_password', counselor_id=counselor_id) }}">
            <div class="mb-3">
              <label for="new_password" class="form-label">New Password <span class="text-danger">*</span></label>
              <input type="password" class="form-control" id="new_password" name="new_password" required>
            </div>
            <div class="mb-3">
              <label for="confirm_password" class="form-label">Confirm Password <span class="text-danger">*</span></label>
              <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
            </div>
            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-primary-custom">Reset Password</button>
              <a href="{{ url_for('admin_manage_counselors') }}" class="btn btn-cancel">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
